# 로컬 개발용 MySQL.
# 용어: 이미지(image) / 컨테이너(container) / 볼륨(volume) / 헬스체크(healthcheck)
#   - 이미지는 설계도, 컨테이너는 그 설계도로 띄운 실행 인스턴스.
#   - 볼륨이 없으면 컨테이너를 지울 때 DB 데이터도 같이 사라진다.
#
# TODO [6단계] 앱 자체도 컨테이너로 띄우기. 상세 계획은 docs/ROADMAP.md 의 "배포" 섹션.
#   (Dockerfile 작성 + app 서비스 추가 + depends_on: condition: service_healthy)

services:
  mysql:
    image: mysql:8.4
    container_name: seat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seat_reservation
      MYSQL_USER: app # 이 계정은 seat_reservation 스키마 안에서만 권한을 받는다 (아래 init SQL 참고)
      MYSQL_PASSWORD: app1234
    ports:
      # 호스트(내 Mac) 3307 → 컨테이너 3306. 로컬에 MySQL 이 이미 설치되어 3306 을 쓰는 경우가 많아 피했다 (docs/REVIEW.md 2번).
      # 앱은 localhost:3307 로 접속한다 (.env 의 DATABASE_URL). 컨테이너 안에서는 여전히 3306 이다.
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 볼륨이 "처음" 만들어질 때 한 번만 실행되는 SQL. app 계정에 `prisma migrate dev` 가 요구하는
      # 전역 권한을 준다 (docker/mysql/init/01-grant-migrate.sql 의 설명 참고).
      # 이미 볼륨이 있으면 실행되지 않는다 → 다시 적용하려면 `docker compose down -v` 로 볼륨을 지운다.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
