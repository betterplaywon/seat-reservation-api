# pnpm 설정 파일. 이 프로젝트는 모노레포가 아니지만 pnpm 10 부터 설정을 이 파일에 둔다.
#
# pnpm 10 은 보안상 의존성의 설치 스크립트(postinstall 등)를 기본으로 실행하지 않는다.
# (용어: 공급망 공격 supply-chain attack — 설치만 해도 악성 스크립트가 실행되는 사고를 막기 위함)
# 설치 시 스크립트가 꼭 필요한 패키지만 아래에 명시적으로 허용한다.

onlyBuiltDependencies:
  - '@prisma/client' # 설치 시 Prisma 클라이언트 생성
  - '@prisma/engines' # 쿼리 엔진 바이너리 다운로드
  - prisma
  - bcrypt # TODO [3단계] 설치 예정. 네이티브(C++) 모듈이라 설치 시 빌드/프리빌트 다운로드가 필요

ignoredBuiltDependencies:
  - '@scarf/scarf' # swagger-ui 의 사용량 수집 스크립트. 필요 없으므로 명시적으로 차단
